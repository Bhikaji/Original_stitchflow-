---
deployment:
  tasks:
    - export DEPLOYPATH=/home/kenerp/public_html/kend2c/test_stitchflow/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R * $DEPLOYPATH
    - /bin/cp -R .[^.]* $DEPLOYPATH
